name: check-harness

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync-check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate portable core
        run: node scripts/sync-harness.mjs --check --source-mode
      - name: Validate PowerShell wrapper
        if: runner.os == 'Windows'
        run: pwsh scripts/sync-harness.ps1 -Check -SourceMode
      - name: Validate Bash wrapper
        if: runner.os != 'Windows'
        run: bash scripts/sync-harness.sh --check --source-mode
      - name: Validate committed dist/ in sync
        if: runner.os == 'Linux'
        run: |
          node scripts/sync-harness.mjs --build-dist
          git add -A -- dist
          git diff --cached --exit-code -- dist
      - name: Skill conformance (spec + budget ratchets)
        run: node scripts/validate-skills.mjs
      - name: Hot-path budget (ceilings are a ratchet)
        run: node scripts/measure-hotpath.mjs
      - name: Mutation suite (the instruments catch planted defects)
        if: runner.os == 'Linux'
        run: node tests/mutation/run.mjs

  contract-tests:
    strategy:
      fail-fast: false
      matrix:
        # macOS included: the writegate's case-insensitive path comparison covers darwin,
        # and until now no contract test ever executed there (v3 audit, F7).
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run harness contracts
        run: pwsh scripts/test-harness-contracts.ps1
