# CodeRabbit configuration for the PelizzAI harness source repo.
#
# What this repository is: a skills harness for coding agents (Claude Code,
# Cursor, Gemini CLI, and the like). The "product" is instructional prose in markdown — the
# skills — plus a few hooks and distribution scripts. There is no running application: a
# regression here is an ambiguous, contradictory, or lost instruction, not a stack trace.
#
# Single source: .claude/. The targets GENERATED by scripts/sync-harness.mjs (.agents/,
# .cursor/, AGENTS.md, GEMINI.md, manifest) are 1:1 copies of the source — reviewing them
# duplicates every finding. Review only the source; the CI sync-check job guarantees the sync.

language: pt-BR

reviews:
  profile: assertive
  request_changes_workflow: false

  path_filters:
    # Mirrors generated by sync-harness.mjs — never review (duplicate finding of the source
    # in .claude/). NOTE: .cursor/rules/pelizzai.mdc does NOT belong here — it is a MANUAL
    # adapter, the sync does not generate it, and that is exactly why it is the file that
    # most needs human review when the entrypoints change.
    - "!.agents/**"
    - "!AGENTS.md"
    - "!GEMINI.md"
    - "!scripts/pelizzai-core-skills.txt"

  path_instructions:
    - path: ".claude/skills/**/SKILL.md"
      instructions: |
        This is a SKILL: instructional prose read by a coding agent at runtime, not
        documentation for humans. Evaluate it as executable instruction.

        Check:
        - Valid YAML frontmatter with `name` and `description`. The `name` must match the
          directory name. The `description` is what gets the skill FOUND — it must contain
          the real usage triggers (including colloquial phrasings), not a pretty summary.
          Only SKILL.md carries frontmatter; files under references/, templates/, evals/,
          and techniques/ carry none.
        - Ambiguous or contradictory instruction WITHIN the file or against another skill
          it cites. A contradiction between two sections of the same file is the most
          common and most expensive defect here.
        - Dead pointer: every `references/...`, every `templates/...`, and every
          `pelizzai-*` name cited in prose must actually exist.
        - User authority: the harness RECOMMENDS and the user RATIFIES. Flag any text that
          authorizes the agent to decide scope, UX, architecture, data, accepted risk, or
          acceptance criteria on its own. A material gap found during development must lead
          to `pelizzai-interview-me`, never to a default.
        - This repository is PUBLIC and clonable into any project: it must contain no local
          path, no private project name, and no personal convention of the author.

    - path: ".claude/hooks/**"
      instructions: |
        Hooks executed by the agent on the machine of whoever installed the harness. Each
        hook exists as a `.mjs` (Node) and `.ps1` (PowerShell) pair, and the two MUST behave
        identically — divergence between the two legs is a bug, even when each one is
        correct in isolation.

        Check rigorously:
        - A matcher FALSE POSITIVE is the most serious defect here: this repo is public, and
          an undue block halts a stranger's work. Pay attention to null-sink paths
          (NUL, nul, $null, /dev/null), redirection outside the repository root
          ($env:TEMP, %TEMP%, absolute paths), and git commands that merely CONTAIN a
          dangerous word without being destructive (e.g. `git add src/restore.ts`,
          `git commit -m "fix: restore ..."`, `git branch -M main`).
        - Blocking code (exit 2) must fail closed for a clear reason and print an
          actionable message saying what to do.
        - Shell and argument parsing: quotes, escaping, paths with spaces.

    - path: "scripts/**"
      instructions: |
        Cross-platform sync and distribution scripts (canonical Node in .mjs; .ps1/.sh are
        thin wrappers). `scripts/test-harness-contracts.ps1` is the contract suite: each
        assertion locks in one harness behavior.

        Check:
        - Weakened assertion: a regex that now matches almost anything, or a
          `Check-NotMatch` turned into a no-op. An assertion that cannot fail is worse than
          no assertion at all, because it simulates coverage.
        - New or restored behavior without a corresponding assertion.
        - `scripts/pelizzai-source-repo.txt` is the source-repo sentinel: it must be
          removed on export to a consumer, never copied.
        - Windows/Linux/macOS portability and handling of paths with spaces.

    - path: ".cursor/rules/pelizzai.mdc"
      instructions: |
        MANUAL adapter for Cursor — `sync-harness.mjs` does not generate it. Its sole job is
        to forward to the entrypoints (`AGENTS.md`, `.agents/skills/`) and to the shared
        rules.

        Check that it remains consistent with what the source says after this change: a
        skill name that no longer exists, a renamed entrypoint, an instruction that
        contradicts `CLAUDE.md`. Since no CI job compares this file with the source, drift
        here is only caught by review — flag any staleness.

    - path: "**/*.md"
      instructions: |
        Write the review in Brazilian Portuguese, with correct accents. The repository
        content is entirely in English: flag pt-BR text that has slipped through, and also
        spelling or grammar mistakes. The brand is spelled exactly "PelizzAI" in prose —
        never "Pelizzai", "pelizzAI", or "PELIZZAI".
